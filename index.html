<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BPJEPS MAPST — Carnet &amp; devoirs</title>
<meta name="description" content="Carnet de notes par bloc et par cours, et suivi des devoirs à rendre, pour le BPJEPS MAPST.">
<meta name="theme-color" content="#2451d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet BPJEPS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* ===== BPJEPS MAPST — Carnet & devoirs : feuille de style (même identité que la plateforme) ===== */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --surface-2: #f8f9fd; --text: #171a26; --muted: #5d6478; --border: #e3e6ef;
  --primary: #2451d8; --primary-soft: #e8edfd; --primary-ink: #1b3fb0; --accent: #f59e0b; --success: #16a34a; --success-soft: #e6f7ec;
  --danger: #dc2626; --danger-soft: #fdecec; --warn: #d97706; --warn-soft: #fff4e0; --info-soft: #e8f1fd; --mark: #fff59d;
  --shadow: 0 1px 2px rgba(20,24,40,.05), 0 6px 20px -8px rgba(20,24,40,.12);
  --radius: 14px; --radius-sm: 9px; --sidebar-w: 260px; --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; --fs: 16px;
}
:root[data-theme="dark"] {
  --bg: #0f1220; --surface: #171b2c; --surface-2: #1d2235; --text: #e9ebf5; --muted: #a0a7bd; --border: #2a3047;
  --primary: #6d8cff; --primary-soft: #23305a; --primary-ink: #c3d0ff; --accent: #fbbf24; --success: #34d399; --success-soft: #123326;
  --danger: #f87171; --danger-soft: #3b1a1a; --warn: #fbbf24; --warn-soft: #3a2a10; --info-soft: #1b2a45; --mark: #7a6a1a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html { font-size: var(--fs); }
body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ---- Layout ---- */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }
.sidebar { background: var(--surface); border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; z-index: 30; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 12px; }
.brand-logo { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, #2451d8, #7c3aed); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .3px; flex-shrink: 0; }
.brand-title { font-weight: 800; font-size: 15px; line-height: 1.15; }
.brand-sub { font-size: 12px; color: var(--muted); }
.nav { padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav-section { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); padding: 12px 10px 4px; font-weight: 700; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; color: var(--text); font-weight: 500; font-size: 14.5px; }
.nav a:hover { background: var(--surface-2); text-decoration: none; }
.nav a.active { background: var(--primary-soft); color: var(--primary-ink); font-weight: 700; }
.nav a .ic { width: 22px; text-align: center; flex-shrink: 0; font-size: 15px; }
.nav a .mc-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin: 0 6px; }
.nav .badge { margin-left: auto; }
.nav a.sub { padding: 6px 10px 6px 12px; font-size: 13.5px; }
.sidebar-foot { margin-top: auto; padding: 12px 16px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 22px; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.topbar .search { flex: 1; max-width: 560px; position: relative; }
.topbar .search input { width: 100%; padding: 9px 12px 9px 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); outline: none; }
.topbar .search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.topbar .search .sic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
.topbar .spacer { flex: 1; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; color: var(--text); font-size: 16px; }
.icon-btn:hover { background: var(--surface-2); }
.menu-btn { display: none; }
.content { padding: 22px 26px 60px; max-width: 1180px; width: 100%; margin: 0 auto; }
.content.narrow { max-width: 900px; }

/* ---- Composants ---- */
h1.page-title { font-size: 26px; margin: 4px 0 6px; letter-spacing: -.3px; }
.page-sub { color: var(--muted); margin: 0 0 20px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.card + .card { margin-top: 14px; }
.card h2 { margin: 0 0 10px; font-size: 18px; }
.card h3 { margin: 14px 0 6px; font-size: 15px; }
.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.bold { font-weight: 700; }
.mt { margin-top: 14px; } .mt-lg { margin-top: 26px; } .mb { margin-bottom: 14px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 600; font-size: 14px; transition: .15s; white-space: nowrap; }
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-ink); border-color: var(--primary-ink); }
.btn-success { background: var(--success); border-color: var(--success); color: #fff; }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
.badge-primary { background: var(--primary-soft); color: var(--primary-ink); border-color: transparent; }
.badge-success { background: var(--success-soft); color: var(--success); border-color: transparent; }
.badge-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge-danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.pill-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.pill-tabs button { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: 13.5px; color: var(--text); }
.pill-tabs button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
select.select, input.input, textarea.input { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); width: 100%; }
select.select:focus, input.input:focus, textarea.input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
textarea.input { min-height: 90px; resize: vertical; line-height: 1.5; }
label.lbl { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 8px 0 4px; }
.kbd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; padding: 1px 6px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 6px; background: var(--surface-2); }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); z-index: 100; animation: pop .2s ease-out; max-width: 90vw; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, 8px);} to { opacity: 1; transform: translate(-50%, 0);} }
.modal-bg { position: fixed; inset: 0; background: rgba(10,12,25,.55); z-index: 90; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 16px; padding: 22px; width: min(640px, 100%); max-height: 90vh; overflow: auto; box-shadow: var(--shadow); }
.modal h2 { margin: 0 0 12px; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-size: 26px; font-weight: 800; letter-spacing: -.5px; line-height: 1.1; }
.stat .l { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.divider { height: 1px; background: var(--border); margin: 14px 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12.5px; font-weight: 600; color: var(--text); }
.chip:hover { text-decoration: none; border-color: var(--primary); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.crumbs a { color: var(--muted); }

/* ---- Accueil ---- */
.hero { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 22px 24px; border-radius: 18px; background: linear-gradient(120deg, #2451d8 0%, #4f46e5 55%, #7c3aed 100%); color: #fff; box-shadow: var(--shadow); }
.hero h1 { margin: 0 0 4px; font-size: 24px; }
.hero p { margin: 0; opacity: .92; }
.hero .btn { background: #fff; color: #1b3fb0; border-color: #fff; }
.hero .btn:hover { background: #eef1ff; }
.hero .btn-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
.hero .btn-ghost:hover { background: rgba(255,255,255,.12); }
.module-card { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); color: var(--text); transition: transform .15s; position: relative; overflow: hidden; }
.module-card:hover { transform: translateY(-2px); text-decoration: none; }
.module-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--mc, var(--primary)); }
.module-card .mc-head { display: flex; align-items: center; gap: 10px; }
.module-card .mc-icon { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-size: 21px; background: color-mix(in srgb, var(--mc) 14%, var(--surface)); flex-shrink: 0; }
.module-card .mc-code { font-size: 11px; font-weight: 800; letter-spacing: .6px; color: var(--mc); text-transform: uppercase; }
.module-card .mc-title { font-weight: 700; font-size: 14.5px; line-height: 1.25; }
.module-card .mc-sub { font-size: 12.5px; color: var(--muted); }
.module-head { display: flex; gap: 16px; align-items: center; padding: 18px 22px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); border-left: 6px solid var(--mc); box-shadow: var(--shadow); }
.module-head .big-icon { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 28px; background: color-mix(in srgb, var(--mc) 14%, var(--surface)); flex-shrink: 0; }
.module-head h1 { margin: 0; font-size: 22px; }
.chapter { margin-top: 16px; }
.chapter-title { display: flex; align-items: center; gap: 10px; font-size: 15px; margin: 0 0 6px; }
.chapter-title .num { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--mc) 14%, var(--surface)); color: var(--mc); font-size: 13px; font-weight: 800; }
.lesson-list { display: flex; flex-direction: column; gap: 4px; }
.lesson-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--text); }
.lesson-row:hover { border-color: var(--mc); text-decoration: none; }
.lesson-row .lt { flex: 1; font-size: 14px; }
.lesson-row .meta { display: flex; gap: 8px; align-items: center; }
.lesson-row.has-notes { border-left: 3px solid var(--mc); }

/* ---- Notes ---- */
.note-list { display: flex; flex-direction: column; gap: 8px; }
.note-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); color: var(--text); }
.note-row:hover { text-decoration: none; border-color: var(--primary); }
.note-row .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; background: color-mix(in srgb, var(--mc, var(--primary)) 14%, var(--surface)); flex-shrink: 0; }
.note-row .t { font-weight: 700; font-size: 14.5px; }
.note-row .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.note-row .x { font-size: 13px; color: var(--muted); margin-top: 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.note-row .fav { margin-left: auto; color: var(--accent); font-size: 16px; }
.editor-head { display: flex; flex-direction: column; gap: 8px; }
.editor-title { font-size: 24px; font-weight: 800; border: none; background: transparent; width: 100%; padding: 6px 0; border-bottom: 2px solid transparent; letter-spacing: -.3px; }
.editor-title:focus { outline: none; border-bottom-color: var(--primary); }
.editor-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.editor-meta .wrap { display: inline-flex; max-width: 100%; min-width: 0; }
.editor-meta .wrap select { max-width: 100%; }
.editor-meta select, .editor-meta input { padding: 5px 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; width: auto; max-width: min(100%, 340px); text-overflow: ellipsis; }
.toolbar { position: sticky; top: 58px; z-index: 10; display: flex; gap: 4px; flex-wrap: wrap; padding: 6px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); margin: 12px 0 10px; }
.toolbar button { border: 1px solid transparent; background: transparent; border-radius: 8px; min-width: 34px; height: 34px; padding: 0 8px; font-size: 14px; font-weight: 700; color: var(--text); }
.toolbar button:hover { background: var(--surface-2); border-color: var(--border); }
.toolbar button.on { background: var(--primary-soft); color: var(--primary-ink); }
.toolbar .sep { width: 1px; background: var(--border); margin: 4px 3px; }
.toolbar .status { margin-left: auto; align-self: center; font-size: 12px; color: var(--muted); padding-right: 8px; }
.editor { min-height: 55vh; padding: 18px 22px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); font-size: 16px; line-height: 1.6; outline: none; }
.editor:focus { border-color: var(--primary); }
.editor:empty::before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; }
.editor h2 { font-size: 20px; margin: 18px 0 6px; } .editor h3 { font-size: 17px; margin: 14px 0 4px; }
.editor p, .editor div { margin: 0 0 4px; }
.editor ul, .editor ol { margin: 4px 0 8px; padding-left: 26px; }
.editor mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
.editor blockquote { margin: 8px 0; padding: 6px 14px; border-left: 4px solid var(--primary); background: var(--surface-2); border-radius: 0 8px 8px 0; color: var(--muted); }
.editor input[type=checkbox] { width: 17px; height: 17px; vertical-align: -3px; margin: 0 6px 0 0; accent-color: var(--primary); cursor: pointer; }
.editor a { text-decoration: underline; }
.editor code { font-family: ui-monospace, Menlo, monospace; font-size: 14px; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.editor hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.editor-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--info-soft); color: var(--primary-ink); font-size: 12px; font-weight: 700; }
.tag:hover { text-decoration: none; filter: brightness(.95); }

/* ---- Devoirs ---- */
.dev-list { display: flex; flex-direction: column; gap: 8px; }
.dev-group { margin-top: 18px; }
.dev-group h3 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dev { display: flex; align-items: flex-start; gap: 12px; padding: 11px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--mc, var(--border)); }
.dev.done { opacity: .6; }
.dev.done .t { text-decoration: line-through; }
.dev input[type=checkbox] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--success); cursor: pointer; flex-shrink: 0; }
.dev .body { flex: 1; min-width: 0; cursor: pointer; }
.dev .t { font-weight: 700; font-size: 14.5px; }
.dev .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dev .d { font-size: 13px; color: var(--text); margin-top: 4px; white-space: pre-wrap; }
.dev .due { font-weight: 700; }
.dev .due.late { color: var(--danger); } .dev .due.today { color: var(--warn); } .dev .due.soon { color: var(--primary-ink); }
.prio { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.prio.haute { background: var(--danger); } .prio.normale { background: var(--primary); } .prio.basse { background: var(--muted); }
.quick-add { display: flex; gap: 8px; flex-wrap: wrap; }
.quick-add input.input { flex: 1; min-width: 200px; }
.quick-add input[type=date] { width: auto; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.day { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px; min-height: 140px; }
.day.today { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.day h4 { margin: 0 0 6px; font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; }
.day h4 b { color: var(--text); font-size: 15px; }
.day .mini { display: block; padding: 6px 8px; border-radius: 8px; background: var(--surface-2); border-left: 3px solid var(--mc, var(--primary)); font-size: 12.5px; font-weight: 600; margin-bottom: 5px; color: var(--text); cursor: pointer; }
.day .mini.done { opacity: .5; text-decoration: line-through; }
.day .mini:hover { text-decoration: none; background: var(--primary-soft); }

/* ---- Recherche / résultats ---- */
.snip { font-size: 13px; color: var(--muted); } .snip mark { background: var(--mark); color: inherit; }
.result-list { display: flex; flex-direction: column; gap: 8px; }

/* ---- Réglages ---- */
.sync-code { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; word-break: break-all; min-height: 120px; }

/* ---- Responsive ---- */
@media (max-width: 960px) { .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); } .week { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 280px; transform: translateX(-100%); transition: transform .25s; height: 100vh; box-shadow: 0 0 40px rgba(0,0,0,.25); }
  .sidebar.open { transform: translateX(0); }
  .sidebar-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 29; }
  .menu-btn { display: grid; }
  .content { padding: 14px 14px 90px; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .week { grid-template-columns: 1fr; } .day { min-height: 0; }
  .hero { flex-direction: column; align-items: flex-start; }
  h1.page-title { font-size: 22px; }
  .topbar { padding: 8px 12px; } .topbar .spacer { display: none; }
  .toolbar { top: 54px; }
  .editor { padding: 14px; min-height: 50vh; }
  .editor-title { font-size: 20px; }
  .card { padding: 14px; }
}
@media print {
  .sidebar, .topbar, .toolbar, .editor-actions, .no-print, .editor-meta select { display: none !important; }
  .app { display: block; } .content { padding: 0; max-width: none; }
  body { background: #fff; color: #000; } .editor, .card { box-shadow: none; border: none; }
}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-logo">BP</div><div><div class="brand-title">Carnet BPJEPS</div><div class="brand-sub">Notes de cours · devoirs</div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">Fait pour Pablo · <span id="version"></span><br>Compagnon de la plateforme « Mon prof »</div>
  </aside>

<script>

  /* ---------------- Utilitaires ---------------- */
  const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const fmtDate = s => s ? parse(s).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
  const fmtLong = s => s ? parse(s).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) : '';
  const fmtTs = t => new Date(t).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + ' ' + new Date(t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const plural = (n, w) => `${n} ${w}${n > 1 ? 's' : ''}`;
  function toast(msg, ms) { $$('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms || 2200); }
  function modal(html, onReady) { $$('.modal-bg').forEach(m => m.remove()); const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.innerHTML = `<div class="modal" role="dialog">${html}</div>`; document.body.appendChild(bg); bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); }); $$('[data-close]', bg).forEach(b => b.addEventListener('click', () => bg.remove())); if (onReady) onReady(bg); return bg; }
  function confirmBox(msg, ok) { const bg = modal(`<h2>Confirmer</h2><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Annuler</button><button class="btn btn-danger" id="cf-ok">Confirmer</button></div>`); $('#cf-ok', bg).addEventListener('click', () => { bg.remove(); ok(); }); }
  const modOf = id => MOD[id] || LIBRE;
  const lesOf = id => id ? LES[id] : null;
  const platformUrl = () => { let u = (S.settings.platformUrl || '').trim(); if (!u) return ''; if (!/^https?:\/\//i.test(u)) u = 'https://' + u; u = u.replace(/#.*$/, ''); if (!/\.html$/i.test(u) && !u.endsWith('/')) u += '/'; return u; };
  const platformLink = (kind, id) => { const u = platformUrl(); return u ? `${u}#/${kind}/${id}` : ''; };
  function platformBtn(kind, id, label) { const u = platformLink(kind, id); return u ? `<a class="btn btn-sm" href="${esc(u)}" target="_blank" rel="noopener">↗ ${esc(label || 'Ouvrir sur la plateforme')}</a>` : `<a class="btn btn-sm muted" href="#/reglages" title="Renseigne l'adresse de la plateforme dans les réglages">↗ ${esc(label || 'Ouvrir sur la plateforme')}</a>`; }
  const notesOf = f => S.notes.filter(f).sort((a, b) => b.updatedAt - a.updatedAt);
  const devOpen = d => d.status !== 'done';
  const devUrgent = () => S.devoirs.filter(d => devOpen(d) && d.due && daysDiff(d.due) <= 7).length;
  const textOf = html => { const d = document.createElement('div'); d.innerHTML = html || ''; return (d.textContent || '').replace(/\s+/g, ' ').trim(); };
  const words = t => (t || '').split(/\s+/).filter(Boolean).length;
  const snippet = (text, q, n) => { const i = norm(text).indexOf(norm(q)); if (i < 0) return esc(text.slice(0, n || 140)); const a = Math.max(0, i - 50), b = Math.min(text.length, i + q.length + 90); return (a ? '… ' : '') + esc(text.slice(a, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length, b)) + (b < text.length ? ' …' : ''); };

  /* ---------------- Nettoyage du HTML des notes ---------------- */
  const ALLOW = { P: 1, DIV: 1, BR: 1, B: 1, STRONG: 1, I: 1, EM: 1, U: 1, S: 1, STRIKE: 1, MARK: 1, H2: 1, H3: 1, UL: 1, OL: 1, LI: 1, A: 1, INPUT: 1, BLOCKQUOTE: 1, CODE: 1, PRE: 1, HR: 1 };
  function rename(el, tag) { const n = el.ownerDocument.createElement(tag); while (el.firstChild) n.appendChild(el.firstChild); el.replaceWith(n); return n; }
  function unwrap(el) { const p = el.parentNode; while (el.firstChild) p.insertBefore(el.firstChild, el); el.remove(); }
  function clean(node) {
    Array.from(node.childNodes).forEach(ch => {
      if (ch.nodeType === 3) return;
      if (ch.nodeType !== 1) { ch.remove(); return; }
      let tag = ch.nodeName;

      if (tag === 'TABLE' || tag === 'TR' || tag === 'TD' || tag === 'TH' || tag === 'TBODY' || tag === 'THEAD') { clean(ch); if (tag === 'TR') ch.appendChild(ch.ownerDocument.createElement('br')); unwrap(ch); return; }
      if (!ALLOW[tag]) { clean(ch); unwrap(ch); return; }
      if (tag === 'INPUT') { if ((ch.getAttribute('type') || '').toLowerCase() !== 'checkbox') { ch.remove(); return; } const on = ch.hasAttribute('checked') || ch.checked; Array.from(ch.attributes).forEach(a => ch.removeAttribute(a.name)); ch.setAttribute('type', 'checkbox'); if (on) ch.setAttribute('checked', ''); return; }
      const href = tag === 'A' ? (ch.getAttribute('href') || '') : '';
      const hl = tag !== 'MARK' && /background/i.test(ch.getAttribute('style') || '');
      Array.from(ch.attributes).forEach(a => ch.removeAttribute(a.name));
      if (hl) { const mk = ch.ownerDocument.createElement('mark'); while (ch.firstChild) mk.appendChild(ch.firstChild); ch.appendChild(mk); }
      if (tag === 'A') { if (/^(https?:\/\/|mailto:|#)/i.test(href)) { ch.setAttribute('href', href); ch.setAttribute('target', '_blank'); ch.setAttribute('rel', 'noopener'); } else { clean(ch); unwrap(ch); return; } }
      clean(ch);
    });
  }
  function sanitize(html) { const doc = new DOMParser().parseFromString('<div id="r">' + (html || '') + '</div>', 'text/html'); const r = doc.getElementById('r'); clean(r); return r.innerHTML; }

  /* ---------------- Routage & coquille ---------------- */
  const main = $('#main');
  function parseHash() { const h = location.hash.replace(/^#\/?/, ''); const parts = h.split('/').map(p => { try { return decodeURIComponent(p); } catch (e) { return p; } }); return { name: parts[0] || 'accueil', args: parts.slice(1) }; }
  function go(path) { location.hash = '#/' + path; }
  const ROUTES = {};

      <a href="#/devoirs" data-route="devoirs"><span class="ic">📌</span> Devoirs <span class="badge badge-danger" id="dev-badge" hidden></span></a>

  function dueLabel(d) { if (!d.due) return '<span class="muted">sans date</span>'; const k = daysDiff(d.due); const cls = k < 0 ? 'late' : k === 0 ? 'today' : k <= 3 ? 'soon' : ''; const txt = k < 0 ? `en retard de ${plural(-k, 'jour')}` : k === 0 ? "aujourd'hui" : k === 1 ? 'demain' : `J-${k}`; return `<span class="due ${cls}">${txt} · ${fmtDate(d.due)}</span>`; }

  function bindDevRows(root) {

  /* ---------------- Accueil ---------------- */
  ROUTES.accueil = function () {

    const groups = [['⏰ En retard', open.filter(d => d.due && daysDiff(d.due) < 0), 'badge-danger'], ["📍 Aujourd'hui", open.filter(d => d.due && daysDiff(d.due) === 0), 'badge-warn'], ['📅 Cette semaine', open.filter(d => d.due && daysDiff(d.due) > 0 && daysDiff(d.due) <= 7), 'badge-primary'], ['🗓 Plus tard', open.filter(d => d.due && daysDiff(d.due) > 7), ''], ['🕳 Sans date', open.filter(d => !d.due), '']];
    const shown = devFilter === 'done' ? [] : devFilter === 'doing' ? groups.map(g => [g[0], g[1].filter(d => d.status === 'doing'), g[2]]) : groups;
    content(`<div class="row between"><h1 class="page-title">📌 Devoirs</h1><div class="row"><a class="btn" href="#/devoirs/semaine">🗓 Vue semaine</a><button class="btn btn-primary" id="dev-add">＋ Nouveau devoir</button></div></div>
      <p class="page-sub">${plural(open.length, 'devoir')} à faire · ${done.length} terminé${done.length > 1 ? 's' : ''}</p>
      <div class="card"><div class="quick-add"><input class="input" id="qa-title" placeholder="Ajout rapide : ex. Rendre le dossier BC1…" autocomplete="off"><input class="input" type="date" id="qa-due" value=""><button class="btn btn-primary" id="qa-add">Ajouter</button></div></div>
      <div class="row mt between"><div class="pill-tabs" id="dev-tabs"><button data-f="open" class="${devFilter === 'open' ? 'active' : ''}">À faire</button><button data-f="doing" class="${devFilter === 'doing' ? 'active' : ''}">En cours</button><button data-f="done" class="${devFilter === 'done' ? 'active' : ''}">Terminés</button></div><select class="select" id="dev-mod" style="width:auto"><option value="">Tous les blocs</option>${MODS.map(m => `<option value="${m.id}" ${devMod === m.id ? 'selected' : ''}>${esc(m.code)}</option>`).join('')}</select></div>
      ${shown.filter(g => g[1].length).map(g => `<div class="dev-group"><h3>${g[0]} <span class="badge ${g[2]}">${g[1].length}</span></h3><div class="dev-list">${g[1].map(devRow).join('')}</div></div>`).join('')}
      ${devFilter !== 'done' && !shown.some(g => g[1].length) ? `<div class="card mt"><p class="empty">${devFilter === 'doing' ? 'Aucun devoir « en cours ».' : 'Aucun devoir à faire. Ajoute-en un dès qu\'un formateur en donne un.'}</p></div>` : ''}
      ${devFilter === 'done' ? (done.length ? `<div class="dev-group"><h3>✅ Terminés</h3><div class="dev-list">${done.slice(0, 50).map(devRow).join('')}</div></div>` : '<div class="card mt"><p class="empty">Rien de terminé pour l\'instant.</p></div>') : ''}`);
    bindDevRows(main);
    $('#dev-add').addEventListener('click', () => devForm(null, { moduleId: devMod || 'libre' }));
    $$('#dev-tabs button').forEach(b => b.addEventListener('click', () => { devFilter = b.dataset.f; devList(); }));
    $('#dev-mod').addEventListener('change', e => { devMod = e.target.value; devList(); });
    const qa = () => { const t = $('#qa-title').value.trim(); if (!t) return $('#qa-title').focus(); S.devoirs.push({ id: uid(), titre: t, desc: '', moduleId: devMod || 'libre', leconId: null, due: $('#qa-due').value || null, prio: 'normale', status: 'todo', lien: '', createdAt: Date.now(), doneAt: null }); save(); toast('Devoir ajouté'); devList(); };
    $('#qa-add').addEventListener('click', qa); $('#qa-title').addEventListener('keydown', e => { if (e.key === 'Enter') qa(); });
  }
  function devForm(id, pre) {
    const d = id ? S.devoirs.find(x => x.id === id) : null; if (id && !d) return toast('Devoir introuvable');
    const v = d || Object.assign({ titre: '', desc: '', moduleId: 'libre', leconId: null, due: null, prio: 'normale', status: 'todo', lien: '' }, pre || {});
    if (!MOD[v.moduleId]) v.moduleId = 'libre';
    const bg = modal(`<h2>${d ? 'Modifier le devoir' : 'Nouveau devoir'}</h2>
      <label class="lbl">Intitulé</label><input class="input" id="df-title" value="${esc(v.titre)}" placeholder="ex. Rendre le dossier de diagnostic BC1" autocomplete="off">
      <div class="grid grid-2"><div><label class="lbl">Bloc</label>${moduleSelect(v.moduleId, 'df-mod')}</div><div><label class="lbl">Cours (facultatif)</label><span id="df-les-wrap">${lessonSelect(v.moduleId, v.leconId, 'df-les')}</span></div></div>
      <div class="grid grid-3"><div><label class="lbl">À rendre le</label><input class="input" type="date" id="df-due" value="${esc(v.due || '')}"></div><div><label class="lbl">Priorité</label><select class="select" id="df-prio"><option value="haute" ${v.prio === 'haute' ? 'selected' : ''}>Haute</option><option value="normale" ${v.prio === 'normale' ? 'selected' : ''}>Normale</option><option value="basse" ${v.prio === 'basse' ? 'selected' : ''}>Basse</option></select></div><div><label class="lbl">État</label><select class="select" id="df-status"><option value="todo" ${v.status === 'todo' ? 'selected' : ''}>À faire</option><option value="doing" ${v.status === 'doing' ? 'selected' : ''}>En cours</option><option value="done" ${v.status === 'done' ? 'selected' : ''}>Terminé / rendu</option></select></div></div>
      <label class="lbl">Détails (consignes, format, où le rendre…)</label><textarea class="input" id="df-desc">${esc(v.desc)}</textarea>
      <label class="lbl">Lien (facultatif : Drive, mail du formateur…)</label><input class="input" id="df-lien" value="${esc(v.lien || '')}" placeholder="https://">
      <div class="row mt" style="justify-content:space-between">${d ? '<button class="btn btn-danger btn-sm" id="df-del">🗑 Supprimer</button>' : '<span></span>'}<div class="row"><button class="btn" data-close>Annuler</button><button class="btn btn-primary" id="df-save">Enregistrer</button></div></div>`);
    $('#df-mod', bg).addEventListener('change', e => { $('#df-les-wrap', bg).innerHTML = lessonSelect(e.target.value, null, 'df-les'); });
    $('#df-title', bg).focus();
    const submit = () => {
      const t = $('#df-title', bg).value.trim(); if (!t) return $('#df-title', bg).focus();
      const o = { titre: t, desc: $('#df-desc', bg).value.trim(), moduleId: $('#df-mod', bg).value, leconId: $('#df-les', bg).value || null, due: $('#df-due', bg).value || null, prio: $('#df-prio', bg).value, status: $('#df-status', bg).value, lien: $('#df-lien', bg).value.trim() };
      if (d) { const wasDone = d.status === 'done'; Object.assign(d, o); if (o.status === 'done' && !wasDone) d.doneAt = Date.now(); if (o.status !== 'done') d.doneAt = null; }
      else S.devoirs.push(Object.assign({ id: uid(), createdAt: Date.now(), doneAt: o.status === 'done' ? Date.now() : null }, o));
      save(); bg.remove(); toast(d ? 'Devoir modifié' : 'Devoir ajouté'); if (parseHash().name === 'devoirs' && parseHash().args[0] && parseHash().args[0] !== 'semaine') history.replaceState(null, '', '#/devoirs'); render();
    };
    $('#df-save', bg).addEventListener('click', submit); bg.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') submit(); });
    if (d) $('#df-del', bg).addEventListener('click', () => confirmBox('Supprimer ce devoir ?', () => { S.devoirs = S.devoirs.filter(x => x.id !== d.id); save(); toast('Devoir supprimé'); if (parseHash().args[0] && parseHash().args[0] !== 'semaine') history.replaceState(null, '', '#/devoirs'); render(); }));
  }
  function weekView(off) {
    const t = parse(today()); const mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay() + 6) % 7) + off * 7);
    const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return iso(d); });
    const end = parse(days[6]);
    content(`<div class="row between"><h1 class="page-title">🗓 Semaine du ${mon.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })}</h1><div class="row"><a class="btn btn-sm" href="#/devoirs/semaine/${off - 1}">← Précédente</a><a class="btn btn-sm" href="#/devoirs/semaine">Aujourd'hui</a><a class="btn btn-sm" href="#/devoirs/semaine/${off + 1}">Suivante →</a><a class="btn btn-sm" href="#/devoirs">☰ Liste</a></div></div>
      <p class="page-sub">Du ${fmtDate(days[0])} au ${fmtDate(days[6])} · clique sur un jour pour ajouter un devoir, sur un devoir pour le modifier.</p>
      <div class="week">${days.map(day => { const ds = S.devoirs.filter(d => d.due === day).sort((a, b) => (a.status === 'done') - (b.status === 'done')); const dt = parse(day); return `<div class="day ${day === today() ? 'today' : ''}"><h4><span>${dt.toLocaleDateString('fr-FR', { weekday: 'short' })} <b>${dt.getDate()}</b></span><button class="btn btn-sm btn-ghost" data-add="${day}" title="Ajouter un devoir ce jour">＋</button></h4>${ds.map(d => { const m = modOf(d.moduleId); return `<span class="mini ${d.status === 'done' ? 'done' : ''}" style="--mc:${m.couleur}" data-edit="${d.id}"><span class="prio ${d.prio || 'normale'}"></span> ${esc(d.titre)}<br><span class="tiny muted">${esc(m.code)}</span></span>`; }).join('')}</div>`; }).join('')}</div>
      ${(() => { const late = S.devoirs.filter(d => devOpen(d) && d.due && daysDiff(d.due) < 0 && parse(d.due) < mon); return late.length ? `<div class="card mt" style="border-color:var(--danger)"><h2>⏰ Toujours en retard</h2><div class="dev-list">${late.map(devRow).join('')}</div></div>` : ''; })()}`);
    $$('[data-add]', main).forEach(b => b.addEventListener('click', () => devForm(null, { due: b.dataset.add, moduleId: 'libre' })));
    $$('.mini[data-edit]', main).forEach(el => el.addEventListener('click', () => devForm(el.dataset.edit)));
    bindDevRows(main);
    void end;
  }

  /* ---------------- Réglages, export / import, synchro ---------------- */
  ROUTES.reglages = function () {
    setNewNoteContext();
    const size = new Blob([JSON.stringify(S)]).size;
    content(`<h1 class="page-title">⚙️ Réglages &amp; sauvegarde</h1><p class="page-sub">Tes notes sont stockées dans ce navigateur uniquement : exporte-les régulièrement, ou utilise le code de synchro pour les passer du PC au téléphone.</p>
      <div class="card"><h2>🔗 Plateforme « Mon prof »</h2><p class="small muted">L'adresse de ta plateforme e-learning (GitHub Pages). Sert aux boutons « Ouvrir le cours sur la plateforme ».</p><div class="row"><input class="input" id="st-url" placeholder="https://ton-compte.github.io/bpjeps-mapst/" value="${esc(S.settings.platformUrl || '')}" style="flex:1;min-width:240px"><button class="btn btn-primary" id="st-url-save">Enregistrer</button>${platformUrl() ? `<a class="btn" href="${esc(platformUrl())}" target="_blank" rel="noopener">Tester ↗</a>` : ''}</div></div>
      <div class="card"><h2>🎨 Affichage</h2><div class="grid grid-3"><div><label class="lbl">Prénom</label><input class="input" id="st-prenom" value="${esc(S.settings.prenom || '')}"></div><div><label class="lbl">Thème</label><select class="select" id="st-theme"><option value="auto" ${S.settings.theme === 'auto' ? 'selected' : ''}>Automatique</option><option value="light" ${S.settings.theme === 'light' ? 'selected' : ''}>Clair</option><option value="dark" ${S.settings.theme === 'dark' ? 'selected' : ''}>Sombre</option></select></div><div><label class="lbl">Taille du texte</label><select class="select" id="st-fs">${[14, 15, 16, 17, 18, 20].map(x => `<option value="${x}" ${(S.settings.fontSize || 16) === x ? 'selected' : ''}>${x} px</option>`).join('')}</select></div></div></div>
      <div class="card"><h2>💾 Sauvegarde (fichier)</h2><p class="small muted">${S.lastExport ? `Dernier export : ${fmtTs(S.lastExport)}` : 'Jamais exporté'} · ${plural(S.notes.length, 'note')}, ${plural(S.devoirs.length, 'devoir')} · ${(size / 1024).toFixed(0)} Ko</p><div class="row"><button class="btn btn-primary" id="st-export">⬇ Exporter (fichier .json)</button><label class="btn">⬆ Importer un fichier <input type="file" id="st-import" accept="application/json,.json" hidden></label></div></div>
      <div class="card"><h2>📱 Code de synchro PC ↔ téléphone</h2><p class="small muted">Génère un code ici, colle-le sur l'autre appareil (par mail, message, presse-papiers). Le code contient tout ton carnet.</p><div class="row"><button class="btn" id="st-gen">Générer mon code</button><button class="btn" id="st-copy" hidden>📋 Copier</button></div><textarea class="input sync-code mt" id="st-code" placeholder="Le code apparaît ici… ou colle ici un code venant d'un autre appareil"></textarea><div class="row mt"><button class="btn btn-primary" id="st-apply">Appliquer le code collé</button></div></div>
      <div class="card"><h2>📲 Installer l'appli</h2><p class="small muted">Sur téléphone : menu du navigateur → « Ajouter à l'écran d'accueil ». Sur PC (Chrome/Edge) : icône d'installation dans la barre d'adresse.</p><button class="btn" id="install-btn" ${window._installPrompt ? '' : 'hidden'}>Installer maintenant</button></div>
      <div class="card" style="border-color:var(--danger)"><h2>🧹 Tout effacer</h2><p class="small muted">Supprime toutes les notes et devoirs de ce navigateur (pense à exporter avant).</p><button class="btn btn-danger" id="st-wipe">Effacer toutes mes données</button></div>`);
    $('#st-url-save').addEventListener('click', () => { S.settings.platformUrl = $('#st-url').value.trim(); save(); toast('Adresse enregistrée'); render(); });
    $('#st-url').addEventListener('keydown', e => { if (e.key === 'Enter') $('#st-url-save').click(); });
    $('#st-prenom').addEventListener('change', e => { S.settings.prenom = e.target.value.trim(); save(); });
    $('#st-theme').addEventListener('change', e => { S.settings.theme = e.target.value; applyTheme(); save(); });
    $('#st-fs').addEventListener('change', e => { S.settings.fontSize = parseInt(e.target.value, 10); applyTheme(); save(); });
    $('#st-export').addEventListener('click', () => { S.lastExport = Date.now(); saveNow(); const blob = new Blob([JSON.stringify({ app: 'carnet-bpjeps', version: window.CARNET_VERSION, exportedAt: new Date().toISOString(), data: S }, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `carnet-bpjeps-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Fichier exporté'); render(); });
    $('#st-import').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { importData(JSON.parse(r.result)); } catch (err) { toast('Fichier illisible'); } }; r.readAsText(f); });
    $('#st-gen').addEventListener('click', async () => { try { const code = await makeSyncCode(); $('#st-code').value = code; $('#st-copy').hidden = false; toast(`Code généré (${(code.length / 1024).toFixed(1)} Ko)`); } catch (err) { toast('Impossible de générer le code'); } });
    $('#st-copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText($('#st-code').value); toast('Code copié'); } catch (err) { $('#st-code').select(); toast('Sélectionne et copie le code manuellement'); } });
    $('#st-apply').addEventListener('click', async () => { const c = $('#st-code').value.trim(); if (!c) return toast('Colle d\'abord un code'); try { importData(await readSyncCode(c)); } catch (err) { toast(err.message === 'format' ? 'Code non reconnu' : err.message); } });
    $('#st-wipe').addEventListener('click', () => confirmBox('Effacer toutes les notes et tous les devoirs de ce navigateur ?', () => { S = DEF(); S.onboarded = true; saveNow(); updateCounts(); applyTheme(); toast('Carnet vidé'); go('accueil'); }));
    const ib = $('#install-btn'); if (ib) ib.addEventListener('click', async () => { const p = window._installPrompt; if (!p) return; p.prompt(); await p.userChoice; window._installPrompt = null; ib.hidden = true; });
  };
  function importData(raw) {
    const o = raw && raw.app === 'carnet-bpjeps' ? raw.data : raw;
    if (!o || !Array.isArray(o.notes) || !Array.isArray(o.devoirs)) return toast('Ce fichier n\'est pas une sauvegarde du carnet');
    const bg = modal(`<h2>Importer ${plural(o.notes.length, 'note')} et ${plural(o.devoirs.length, 'devoir')}</h2><p class="small muted">« Fusionner » garde tout ce que tu as ici et ajoute ou met à jour ce qui vient de l'autre appareil (la version la plus récente gagne). « Remplacer » écrase ce navigateur avec la sauvegarde.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Annuler</button><button class="btn" id="im-replace">Remplacer</button><button class="btn btn-primary" id="im-merge">Fusionner</button></div>`);
    const finish = msg => { bg.remove(); saveNow(); updateCounts(); applyTheme(); toast(msg); render(); };
    $('#im-merge', bg).addEventListener('click', () => { let added = 0, upd = 0; ['notes', 'devoirs'].forEach(k => { o[k].forEach(x => { if (!x || !x.id) return; const i = S[k].findIndex(y => y.id === x.id); if (i < 0) { S[k].push(x); added++; } else if ((x.updatedAt || x.createdAt || 0) > (S[k][i].updatedAt || S[k][i].createdAt || 0)) { S[k][i] = x; upd++; } }); }); if (o.settings && o.settings.platformUrl && !S.settings.platformUrl) S.settings.platformUrl = o.settings.platformUrl; finish(`Fusion : ${added} ajouté${added > 1 ? 's' : ''}, ${upd} mis à jour`); });
    $('#im-replace', bg).addEventListener('click', () => { const d = DEF(); S = Object.assign(d, o, { settings: Object.assign(d.settings, o.settings || {}) }); S.onboarded = true; finish('Sauvegarde restaurée'); });
  }
  const b64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(s); };
  const unb64 = str => { const s = atob(str); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; };
  async function makeSyncCode() { const json = JSON.stringify(S); if (typeof CompressionStream !== 'undefined') { const cs = new CompressionStream('deflate'); const w = cs.writable.getWriter(); w.write(new TextEncoder().encode(json)); w.close(); const buf = await new Response(cs.readable).arrayBuffer(); return 'CAR1:' + b64(new Uint8Array(buf)); } return 'CAR0:' + b64(new TextEncoder().encode(json)); }
  async function readSyncCode(code) { const m = /^CAR([01]):([A-Za-z0-9+/=\s]+)$/.exec(code.trim()); if (!m) throw new Error('format'); const bytes = unb64(m[2].replace(/\s/g, '')); let json; if (m[1] === '1') { if (typeof DecompressionStream === 'undefined') throw new Error('Ce navigateur ne sait pas lire les codes compressés : utilise le fichier.'); const ds = new DecompressionStream('deflate'); const w = ds.writable.getWriter(); w.write(bytes); w.close(); json = await new Response(ds.readable).text(); } else json = new TextDecoder().decode(bytes); const o = JSON.parse(json); if (!o || !o.settings) throw new Error('format'); return o; }

  /* ---------------- Premier lancement ---------------- */
  function onboarding() {
    const bg = modal(`<h2>Bienvenue dans ton carnet 📝</h2><p>Il complète la plateforme « Mon prof » : ici tu écris, là-bas tu révises.</p><ol style="padding-left:20px;line-height:1.7"><li><b>Pendant le cours</b> : ouvre le bloc, clique sur le cours, écris. Tout s'enregistre tout seul.</li><li><b>Un devoir tombe</b> : bouton « ＋ Devoir », mets la date : il remonte sur le tableau de bord quand ça approche.</li><li><b>Réglages</b> : colle l'adresse de ta plateforme pour ouvrir chaque cours en un clic, et exporte ton carnet de temps en temps.</li></ol><div class="row" style="justify-content:flex-end"><a class="btn" href="#/reglages" data-close>Réglages</a><button class="btn btn-primary" data-close>C'est parti</button></div>`);
    S.onboarded = true; save(); void bg;
  }

  /* ---------------- PWA ---------------- */
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window._installPrompt = e; const b = $('#install-btn'); if (b) b.hidden = false; });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').then(reg => { reg.addEventListener('updatefound', () => { const nw = reg.installing; nw && nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('Nouvelle version disponible : recharge la page'); }); }); }).catch(() => { }); }); }

  /* ---------------- Démarrage ---------------- */
  shell(); applyTheme(); S.visits = (S.visits || 0) + 1; save();
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.settings.theme === 'auto') applyTheme(); });
  window.addEventListener('hashchange', render); render();
  if (!S.onboarded) setTimeout(onboarding, 500);
  window.CARNET = { get state() { return S; }, sanitize };
})();

</script>
</body>
